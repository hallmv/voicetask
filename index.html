<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Tasks</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: linear-gradient(145deg, #cfe0f4 0%, #dce8f5 45%, #e8e0f5 100%);
      --white: #ffffff;
      --border: #dde6f3;
      --text-1: #1a2233;
      --text-2: #5a6a8a;
      --text-3: #8a9ab8;
      --accent: #5b7cf6;
      --accent-lt: #eef2ff;
      --orange: #f59e0b;
      --red: #ef4444;
      --red-lt: #fef2f2;
      --blue: #3b82f6;
      --blue-lt: #eff6ff;
      --green: #22c55e;
      --green-lt: #f0fdf4;
      --r: 16px;
      --rs: 8px;
      --sh: 0 2px 8px rgba(0,0,0,.06);
      --shm: 0 4px 20px rgba(0,0,0,.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text-1);
      font-size: 14px;
    }

    .app {
      max-width: 940px;
      margin: 0 auto;
      padding: 28px 16px 140px;
    }

    /* ─── Header ─────────────────────────────── */
    .hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hdr h1 { font-size: 26px; font-weight: 700; }
    .hdr-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .count { font-size: 14px; color: var(--text-3); white-space: nowrap; }

    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px;
      border-radius: 24px;
      border: 1.5px solid var(--border);
      background: var(--white);
      cursor: pointer;
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      transition: .15s;
      white-space: nowrap;
    }
    .pill:hover, .pill.on { background: var(--accent-lt); border-color: var(--accent); color: var(--accent); }

    /* ─── Tab groups ─────────────────────────── */
    .tabs {
      display: flex; gap: 2px;
      padding: 4px;
      background: rgba(255,255,255,.55);
      border-radius: 14px;
      margin-bottom: 12px;
      width: fit-content;
    }
    .tab {
      padding: 7px 16px;
      border-radius: 10px;
      border: none; background: none;
      cursor: pointer;
      font-size: 14px; font-weight: 500;
      color: var(--text-3);
      transition: .15s;
    }
    .tab.on { background: var(--white); color: var(--text-1); box-shadow: var(--sh); }
    .tab .n { font-size: 12px; opacity: .75; }

    /* ─── Filter row ─────────────────────────── */
    .frow {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .sort-sel {
      padding: 7px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 13px; color: var(--text-2);
      cursor: pointer;
    }

    /* ─── Column headers ─────────────────────── */
    .col-hdr {
      display: grid;
      grid-template-columns: 52px 1fr 135px 82px 128px;
      gap: 8px;
      padding: 6px 16px;
      color: var(--text-3);
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
    }

    /* ─── Task card ──────────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--r);
      border-left: 4px solid var(--orange);
      margin-bottom: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: var(--shm); }
    .card.hi  { border-left-color: var(--red); }
    .card.lo  { border-left-color: #a0aec0; }
    .card.dn  { border-left-color: var(--border); opacity: .65; }

    .crow {
      display: grid;
      grid-template-columns: 52px 1fr 135px 82px 128px;
      gap: 8px;
      align-items: start;
      padding: 14px 16px;
    }

    .nc {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-3); padding-top: 2px;
    }
    .cbx {
      width: 20px; height: 20px;
      border-radius: 50%; cursor: pointer;
      accent-color: var(--accent);
    }

    .tname-row { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .dot.hi { background: var(--red); }
    .dot.md { background: var(--orange); }
    .dot.lo { background: var(--text-3); }
    .tname { font-size: 15px; font-weight: 500; line-height: 1.4; }
    .dn .tname { text-decoration: line-through; color: var(--text-3); }

    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .chip { padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .chip-work     { background: #e8f0e8; color: #3a6a3a; }
    .chip-personal { background: #f0e8ff; color: #6030a0; }
    .chip-learning { background: #fff3e0; color: #a05000; }
    .chip-tag      { background: var(--accent-lt); color: var(--accent); border: 1px solid #dce4ff; }

    .inds { display: inline-flex; align-items: center; gap: 2px; margin-left: 2px; }
    .ind  { font-size: 12px; opacity: .55; cursor: default; transition: opacity .15s; }
    .ind:hover { opacity: 1; }

    .dc, .tc { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-2); padding-top: 3px; white-space: nowrap; }
    .sc { display: flex; align-items: flex-start; padding-top: 3px; }

    .badge {
      padding: 4px 11px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .b-ov { background: var(--red-lt);   color: var(--red); }
    .b-up { background: var(--blue-lt);  color: var(--blue); }
    .b-td { background: #fef9e8;         color: #b07800; }
    .b-dn { background: var(--green-lt); color: var(--green); }
    .b-ns { background: #f4f6fb;         color: var(--text-3); }

    /* ─── Expanded panel ─────────────────────── */
    .xpanel { padding: 0 16px 18px; border-top: 1px solid #f0f4ff; }
    .edit-title {
      font-size: 16px; font-weight: 600;
      width: 100%;
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: 9px 12px;
      font-family: inherit; color: var(--text-1); background: #f8faff;
      margin-top: 14px;
    }
    .edit-title:focus { outline: none; border-color: var(--accent); }

    .egrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }
    .ef { display: flex; flex-direction: column; gap: 4px; }
    .ef.full { grid-column: 1 / -1; }
    .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
    .fi {
      padding: 7px 10px;
      border: 1.5px solid var(--border); border-radius: var(--rs);
      font-size: 13px; font-family: inherit;
      color: var(--text-2); background: #f8faff;
    }
    .fi:focus { outline: none; border-color: var(--accent); }

    .sh {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-3);
      margin: 16px 0 7px;
      display: flex; align-items: center; gap: 6px;
    }
    .notes-area {
      width: 100%; min-height: 72px;
      border: 1.5px solid var(--border); border-radius: var(--rs);
      padding: 9px 10px;
      font-size: 13px; font-family: inherit;
      color: var(--text-2); background: #f8faff;
      resize: vertical;
    }
    .notes-area:focus { outline: none; border-color: var(--accent); }

    .links-area { display: flex; flex-direction: column; gap: 6px; }
    .link-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent-lt); border-radius: var(--rs);
      padding: 7px 10px; font-size: 13px;
    }
    .link-row a { color: var(--accent); text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-row a:hover { text-decoration: underline; }
    .ix { background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 14px; padding: 2px 4px; line-height: 1; }
    .ix:hover { color: var(--red); }

    .add-link-row { display: flex; gap: 6px; margin-top: 6px; }
    .add-link-row input {
      flex: 1; padding: 7px 10px;
      border: 1.5px solid var(--border); border-radius: var(--rs);
      font-size: 13px; font-family: inherit;
      color: var(--text-2); background: #f8faff;
    }
    .add-link-row input:focus { outline: none; border-color: var(--accent); }

    .mb {
      padding: 6px 12px; border-radius: var(--rs);
      border: 1.5px solid var(--border);
      background: var(--white); cursor: pointer;
      font-size: 13px; color: var(--text-2); white-space: nowrap;
    }
    .mb:hover { background: var(--accent-lt); border-color: var(--accent); color: var(--accent); }
    .mb.pr { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mb.pr:hover { background: #4a6be0; }
    .mb.dr { color: var(--red); border-color: #fecaca; }
    .mb.dr:hover { background: var(--red-lt); }

    .attach-area { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .ach { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; background: var(--accent-lt); border-radius: var(--rs); font-size: 12px; color: var(--text-2); }
    .fpick { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1.5px dashed #b0bcd8; border-radius: var(--rs); cursor: pointer; font-size: 13px; color: var(--text-3); background: #f8faff; }
    .fpick:hover { border-color: var(--accent); color: var(--accent); }
    .fhint { font-size: 11px; color: var(--text-3); font-style: italic; }

    .recur-opts { display: flex; gap: 6px; flex-wrap: wrap; }
    .rchip { padding: 5px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: #f8faff; cursor: pointer; font-size: 13px; color: var(--text-2); transition: .15s; }
    .rchip.sel { background: var(--accent-lt); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .arow { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

    /* ─── Add bar ─────────────────────────────── */
    .add-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 16px 22px;
      background: linear-gradient(to top, rgba(207,224,244,1) 0%, rgba(207,224,244,.95) 55%, transparent 100%);
    }
    .add-inner {
      max-width: 940px; margin: 0 auto;
      display: flex; align-items: center; gap: 8px;
      background: var(--white); border-radius: 30px;
      padding: 8px 8px 8px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
    }
    .mic { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-3); padding: 4px; flex-shrink: 0; border-radius: 50%; transition: .2s; }
    .mic:hover { color: var(--accent); background: var(--accent-lt); }
    .mic.recording { color: var(--red); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%       { transform: scale(1.2); opacity: .7; }
    }
    .add-inp { flex: 1; border: none; font-size: 14px; font-family: inherit; color: var(--text-1); background: none; }
    .add-inp::placeholder { color: #b0bcd8; }
    .add-inp:focus { outline: none; }
    .add-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 22px; border-radius: 24px; border: none;
      background: linear-gradient(135deg, #7b9cf8, #5b7cf6);
      color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; flex-shrink: 0; transition: .15s;
    }
    .add-btn:hover { background: linear-gradient(135deg, #8badf9, #6b8cf9); }

    /* ─── Loading / error ───────────────────── */
    .loading {
      text-align: center; padding: 60px 20px;
      color: var(--text-3); font-size: 15px;
    }
    .spin {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sync-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--green);
      margin-left: 8px; vertical-align: middle;
      transition: background .3s;
    }
    .sync-dot.syncing { background: var(--orange); animation: pulse .8s ease-in-out infinite; }
    .sync-dot.error   { background: var(--red); animation: none; }

    .empty { text-align: center; padding: 52px; color: var(--text-3); font-size: 15px; }

    @media (max-width: 640px) {
      .crow, .col-hdr { grid-template-columns: 44px 1fr; }
      .dc, .tc, .sc { display: none; }
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <div class="loading"><div class="spin"></div><br>Connecting to database…</div>
</div>

<div class="add-bar">
  <div class="add-inner">
    <button class="mic" id="micBtn" title="Record voice input" onclick="toggleMic()">🎤</button>
    <input class="add-inp" id="addInp" type="text"
      placeholder="Type a task — or tap 🎤 to speak"
      onkeydown="if(event.key==='Enter')addTask()" />
    <button class="add-btn" onclick="addTask()">✦ Add</button>
  </div>
</div>

<input type="file" id="fileIn" style="display:none" multiple onchange="handleFiles(event)" />

<script>
// ─── Supabase ─────────────────────────────────────────────────────────────

const SUPA_URL = 'https://pwefkbohnfpiywjfbjsh.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3ZWZrYm9obmZwaXl3amZianNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDMwNTksImV4cCI6MjA5NjUxOTA1OX0.FoHV4WA5y5fcwE5gKP9IZe8HHx1y747ANWxDUBNPyLY';
const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

// ─── State ────────────────────────────────────────────────────────────────

let tasks  = [];
let catF   = 'all', stF = 'all', srt = 'deadline';
let remOn  = localStorage.getItem('remOn') !== 'false';
let xid    = null;   // expanded task id
let atch   = null;   // attachment target id
let syncing = false;

// ─── DB helpers ───────────────────────────────────────────────────────────

function fromDB(r) {
  return {
    id:           r.id,
    title:        r.title,
    category:     r.category     || 'work',
    tags:         r.tags         || [],
    priority:     r.priority     || 'medium',
    dueDate:      r.due_date     || null,
    timeEstimate: r.time_estimate|| null,
    notes:        r.notes        || '',
    links:        r.links        || [],
    attachments:  r.attachments  || [],
    recurring:    r.recurring    || null,
    completed:    r.completed    || false,
    createdAt:    new Date(r.created_at).getTime(),
  };
}

function toDB(t) {
  return {
    title:         t.title,
    category:      t.category,
    tags:          t.tags,
    priority:      t.priority,
    due_date:      t.dueDate     || null,
    time_estimate: t.timeEstimate|| null,
    notes:         t.notes       || '',
    links:         t.links       || [],
    attachments:   t.attachments || [],
    recurring:     t.recurring   || null,
    completed:     t.completed   || false,
  };
}

// Map camelCase field names to Supabase column names
const FIELD_MAP = {
  dueDate:      'due_date',
  timeEstimate: 'time_estimate',
};
function dbField(f) { return FIELD_MAP[f] || f; }

function setSyncing(on) {
  syncing = on;
  const dot = document.getElementById('syncDot');
  if (dot) dot.className = 'sync-dot' + (on ? ' syncing' : '');
}

function setSyncError() {
  const dot = document.getElementById('syncDot');
  if (dot) dot.className = 'sync-dot error';
  setTimeout(() => { if (dot) dot.className = 'sync-dot'; }, 3000);
}

// ─── Load ─────────────────────────────────────────────────────────────────

async function loadTasks() {
  const { data, error } = await db
    .from('tasks')
    .select('*')
    .order('created_at', { ascending: true });

  if (error) {
    document.getElementById('app').innerHTML =
      `<div class="empty" style="color:var(--red)">
        ⚠️ Could not connect to database.<br>
        <small style="color:var(--text-3)">${error.message}</small>
      </div>`;
    return;
  }

  tasks = (data || []).map(fromDB);
  render();
}

// ─── Status helpers ───────────────────────────────────────────────────────

function stat(t) {
  if (t.completed) return 'done';
  if (!t.dueDate)  return 'none';
  const td = new Date(); td.setHours(0,0,0,0);
  const [y,m,d] = t.dueDate.split('-').map(Number);
  const du = new Date(y, m-1, d);
  if (du < td) return 'overdue';
  if (du.getTime() === td.getTime()) return 'today';
  return 'upcoming';
}

function fmtD(ds) {
  if (!ds) return '—';
  const [y,m,d] = ds.split('-').map(Number);
  return `${m}/${d}/${String(y).slice(-2)}`;
}

function fmtT(mins) {
  if (!mins) return '—';
  const h = Math.floor(mins/60), m = mins%60;
  if (h && m) return `${h}h ${m}m`;
  return h ? `${h}h` : `${m}m`;
}

function fmtB(b) {
  if (!b) return '';
  if (b < 1024) return b + 'B';
  if (b < 1048576) return (b/1024).toFixed(0) + 'KB';
  return (b/1048576).toFixed(1) + 'MB';
}

// ─── Filter / sort ────────────────────────────────────────────────────────

function filtered() {
  return tasks.filter(t => {
    if (catF !== 'all' && t.category !== catF) return false;
    const s = stat(t);
    if (stF === 'today'    && s !== 'today')    return false;
    if (stF === 'upcoming' && s !== 'upcoming') return false;
    if (stF === 'overdue'  && s !== 'overdue')  return false;
    if (stF === 'done'     && !t.completed)     return false;
    return true;
  }).sort((a, b) => {
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    if (srt === 'deadline') {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return new Date(a.dueDate) - new Date(b.dueDate);
    }
    return b.createdAt - a.createdAt;
  });
}

function counts() {
  return {
    all:      tasks.length,
    personal: tasks.filter(t => t.category === 'personal').length,
    work:     tasks.filter(t => t.category === 'work').length,
    learning: tasks.filter(t => t.category === 'learning').length,
    today:    tasks.filter(t => stat(t) === 'today').length,
    upcoming: tasks.filter(t => stat(t) === 'upcoming').length,
    overdue:  tasks.filter(t => stat(t) === 'overdue').length,
    done:     tasks.filter(t => t.completed).length,
  };
}

// ─── Natural language parse ───────────────────────────────────────────────

function parse(raw) {
  let title = raw.trim();
  let dueDate = null, timeEstimate = null;

  const durRe = /\bfor\s+(\d+)\s*(h(?:ours?)?|m(?:in(?:utes?)?)?)\b/i;
  const dm = title.match(durRe);
  if (dm) {
    const v = parseInt(dm[1]);
    timeEstimate = dm[2][0].toLowerCase() === 'h' ? v*60 : v;
    title = title.replace(durRe, '').trim();
  }

  const td = new Date(); td.setHours(0,0,0,0);
  const addD = n => { const d = new Date(td); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; };
  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const dowRe = new RegExp(`\\b(next\\s+)?(${days.join('|')})\\b`, 'i');

  if (/\btoday\b/i.test(title))            { dueDate=addD(0); title=title.replace(/\btoday\b/i,'').trim(); }
  else if (/\btomorrow\b/i.test(title))    { dueDate=addD(1); title=title.replace(/\btomorrow\b/i,'').trim(); }
  else if (/\bnext\s+week\b/i.test(title)) { dueDate=addD(7); title=title.replace(/\bnext\s+week\b/i,'').trim(); }
  else {
    const dm2 = title.match(dowRe);
    if (dm2) {
      const tgt = days.indexOf(dm2[2].toLowerCase());
      let off = tgt - td.getDay();
      if (off <= 0 || dm2[1]) off += 7;
      dueDate = addD(off);
      title = title.replace(dowRe, '').trim();
    }
  }
  title = title.replace(/\bat\s+\d+(?::\d+)?\s*(?:am|pm)?\b/i, '').trim().replace(/\s{2,}/g, ' ');
  return { title: title || raw.trim(), dueDate, timeEstimate };
}

// ─── Mutations ────────────────────────────────────────────────────────────

async function addTask() {
  const inp = document.getElementById('addInp');
  const raw = inp.value.trim();
  if (!raw) return;

  const p = parse(raw);
  inp.value = '';

  setSyncing(true);
  const { data, error } = await db
    .from('tasks')
    .insert(toDB({
      title: p.title, category: 'work', tags: [], priority: 'medium',
      dueDate: p.dueDate, timeEstimate: p.timeEstimate,
      notes: '', links: [], attachments: [], recurring: null, completed: false,
    }))
    .select()
    .single();
  setSyncing(false);

  if (error) { setSyncError(); alert('Failed to save task: ' + error.message); return; }

  const task = fromDB(data);
  tasks.push(task);
  xid = task.id;
  render();
  setTimeout(() => { const el = document.getElementById(`et-${task.id}`); if (el) { el.focus(); el.select(); } }, 50);
}

function toggleDone(id, e) {
  e.stopPropagation();
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.completed = !t.completed;
  render(); // optimistic
  setSyncing(true);
  db.from('tasks').update({ completed: t.completed, updated_at: new Date().toISOString() }).eq('id', id)
    .then(({ error }) => { setSyncing(false); if (error) setSyncError(); });
}

function toggleX(id) {
  xid = (xid === id) ? null : id;
  render();
  if (xid === id) setTimeout(() => { const el = document.getElementById(`et-${id}`); if (el) el.focus(); }, 50);
}

async function del(id) {
  if (!confirm('Delete this task?')) return;
  tasks = tasks.filter(t => t.id !== id);
  if (xid === id) xid = null;
  render(); // optimistic
  setSyncing(true);
  const { error } = await db.from('tasks').delete().eq('id', id);
  setSyncing(false);
  if (error) { setSyncError(); }
}

function upd(id, field, val) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  if (field === 'timeEstimate') val = parseInt(val) || null;
  if (field === 'dueDate') val = val || null;
  t[field] = val;
  // Fire-and-forget for blur-triggered field updates
  setSyncing(true);
  db.from('tasks').update({ [dbField(field)]: val, updated_at: new Date().toISOString() }).eq('id', id)
    .then(({ error }) => { setSyncing(false); if (error) setSyncError(); });
  if (['category', 'priority', 'dueDate'].includes(field)) render();
}

function updTags(id, val) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.tags = val.split(',').map(s => s.trim()).filter(Boolean);
  setSyncing(true);
  db.from('tasks').update({ tags: t.tags, updated_at: new Date().toISOString() }).eq('id', id)
    .then(({ error }) => { setSyncing(false); if (error) setSyncError(); });
}

async function addLink(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const uEl = document.getElementById(`lu-${id}`);
  const lEl = document.getElementById(`ll-${id}`);
  let url = uEl ? uEl.value.trim() : '';
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const label = (lEl ? lEl.value.trim() : '') || url;
  t.links.push({ url, label });
  setSyncing(true);
  const { error } = await db.from('tasks').update({ links: t.links, updated_at: new Date().toISOString() }).eq('id', id);
  setSyncing(false);
  if (error) setSyncError();
  render();
}

async function rmLink(id, i) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.links.splice(i, 1);
  setSyncing(true);
  const { error } = await db.from('tasks').update({ links: t.links, updated_at: new Date().toISOString() }).eq('id', id);
  setSyncing(false);
  if (error) setSyncError();
  render();
}

function openPicker(id) { atch = id; document.getElementById('fileIn').click(); }

async function handleFiles(e) {
  const t = tasks.find(x => x.id === atch);
  if (t) {
    Array.from(e.target.files).forEach(f => t.attachments.push({ name: f.name, size: f.size }));
    setSyncing(true);
    const { error } = await db.from('tasks').update({ attachments: t.attachments, updated_at: new Date().toISOString() }).eq('id', atch);
    setSyncing(false);
    if (error) setSyncError();
  }
  e.target.value = '';
  render();
}

async function rmAtt(id, i) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.attachments.splice(i, 1);
  setSyncing(true);
  const { error } = await db.from('tasks').update({ attachments: t.attachments, updated_at: new Date().toISOString() }).eq('id', id);
  setSyncing(false);
  if (error) setSyncError();
  render();
}

async function setRec(id, val) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.recurring = (t.recurring === val) ? null : val;
  setSyncing(true);
  const { error } = await db.from('tasks').update({ recurring: t.recurring, updated_at: new Date().toISOString() }).eq('id', id);
  setSyncing(false);
  if (error) setSyncError();
  render();
}

async function clearDone() {
  const doneIds = tasks.filter(t => t.completed).map(t => t.id);
  if (!doneIds.length) return;
  tasks = tasks.filter(t => !t.completed);
  render(); // optimistic
  setSyncing(true);
  const { error } = await db.from('tasks').delete().in('id', doneIds);
  setSyncing(false);
  if (error) { setSyncError(); loadTasks(); } // re-fetch on error
}

function toggleRem() { remOn = !remOn; localStorage.setItem('remOn', remOn); render(); }
function setCat(v)   { catF = v; render(); }
function setSt(v)    { stF  = v; render(); }
function setSrt(v)   { srt  = v; render(); }
function collapse()  { xid  = null; render(); }

// ─── Escape HTML ──────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ─── Render ───────────────────────────────────────────────────────────────

function render() {
  const app = document.getElementById('app');
  const fl  = filtered();
  const c   = counts();
  const dn  = tasks.filter(t => t.completed).length;

  app.innerHTML = `
    <div class="hdr">
      <h1>Your Tasks <span id="syncDot" class="sync-dot${syncing ? ' syncing' : ''}"></span></h1>
      <div class="hdr-r">
        <span class="count">${dn}/${tasks.length} done</span>
        <button class="pill${remOn ? ' on' : ''}" onclick="toggleRem()">🔔 Reminders ${remOn ? 'on' : 'off'}</button>
        <button class="pill" onclick="clearDone()">🗑 Clear completed</button>
        <button class="pill" onclick="exportCSV()">⬇ Export CSV</button>
        <label class="pill" style="cursor:pointer">⬆ Import CSV
          <input type="file" accept=".csv,text/csv" style="display:none" onchange="importCSV(event)" />
        </label>
      </div>
    </div>

    <div class="tabs">
      ${tb('all','All',c.all)}${tb('personal','Personal',c.personal)}${tb('work','Work',c.work)}${tb('learning','Learning',c.learning)}
    </div>

    <div class="frow">
      <div class="tabs" style="margin-bottom:0">
        ${stb('all','All',c.all)}${stb('today','Today',c.today)}${stb('upcoming','Upcoming',c.upcoming)}${stb('overdue','Overdue',c.overdue)}${stb('done','Done',c.done)}
      </div>
      <select class="sort-sel" onchange="setSrt(this.value)">
        <option value="deadline" ${srt==='deadline'?'selected':''}>Deadline ↑</option>
        <option value="created"  ${srt==='created' ?'selected':''}>Recently added</option>
      </select>
    </div>

    <div class="col-hdr">
      <span>#</span><span>Task</span><span>Due date</span><span>Time</span><span>Status</span>
    </div>

    <div>
      ${fl.length === 0
        ? '<div class="empty">No tasks here. Add one below! ✦</div>'
        : fl.map((t, i) => card(t, i + 1)).join('')}
    </div>
  `;
}

function tb(val, lbl, n) {
  return `<button class="tab${catF===val?' on':''}" onclick="setCat('${val}')">${lbl} <span class="n">${n}</span></button>`;
}
function stb(val, lbl, n) {
  return `<button class="tab${stF===val?' on':''}" onclick="setSt('${val}')">${lbl} <span class="n">${n}</span></button>`;
}

function card(t, num) {
  const s  = stat(t);
  const pc = t.priority === 'high' ? 'hi' : t.priority === 'low' ? 'lo' : '';
  const dc = t.completed ? 'dn' : '';

  const badge = s==='overdue'  ? `<span class="badge b-ov">● Overdue</span>`
              : s==='today'    ? `<span class="badge b-td">◆ Today</span>`
              : s==='upcoming' ? `<span class="badge b-up">◆ Upcoming</span>`
              : s==='done'     ? `<span class="badge b-dn">✓ Done</span>`
              :                  `<span class="badge b-ns">Not scheduled</span>`;

  const catChip  = `<span class="chip chip-${t.category}">${t.category}</span>`;
  const tagChips = t.tags.map(tg => `<span class="chip chip-tag">${esc(tg)}</span>`).join('');
  const indicators = [
    t.notes && t.notes.trim() ? `<span class="ind" title="Has notes">📝</span>` : '',
    t.links.length            ? `<span class="ind" title="${t.links.length} link${t.links.length>1?'s':''}">🔗</span>` : '',
    t.attachments.length      ? `<span class="ind" title="${t.attachments.length} attachment${t.attachments.length>1?'s':''}">📎</span>` : '',
    t.recurring               ? `<span class="ind" title="Repeats ${t.recurring.toLowerCase()}">🔁</span>` : '',
  ].join('');

  let xhtml = '';
  if (xid === t.id) {
    const linksHtml = t.links.map((l, i) => `
      <div class="link-row">
        <span>🔗</span>
        <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url)}</a>
        <button class="ix" onclick="rmLink(${t.id},${i})">✕</button>
      </div>`).join('');

    const attHtml = t.attachments.map((a, i) => `
      <div class="ach">📎 ${esc(a.name)}<span style="color:var(--text-3);margin-left:3px">(${fmtB(a.size)})</span>
        <button class="ix" onclick="rmAtt(${t.id},${i})" style="margin-left:4px">✕</button>
      </div>`).join('');

    const recHtml = ['Daily','Weekly','Monthly','Yearly'].map(r =>
      `<span class="rchip${t.recurring===r?' sel':''}" onclick="setRec(${t.id},'${r}')">${r}</span>`
    ).join('');

    xhtml = `
      <div class="xpanel" onclick="event.stopPropagation()">
        <input id="et-${t.id}" class="edit-title" value="${esc(t.title)}"
          onblur="upd(${t.id},'title',this.value)"
          onkeydown="if(event.key==='Enter')this.blur()" />

        <div class="egrid">
          <div class="ef">
            <span class="lbl">Category</span>
            <select class="fi" onchange="upd(${t.id},'category',this.value)">
              ${['work','personal','learning'].map(v =>
                `<option value="${v}"${t.category===v?' selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`
              ).join('')}
            </select>
          </div>
          <div class="ef">
            <span class="lbl">Priority</span>
            <select class="fi" onchange="upd(${t.id},'priority',this.value)">
              ${['high','medium','low'].map(v =>
                `<option value="${v}"${t.priority===v?' selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`
              ).join('')}
            </select>
          </div>
          <div class="ef">
            <span class="lbl">Due date</span>
            <input type="date" class="fi" value="${t.dueDate||''}"
              onchange="upd(${t.id},'dueDate',this.value)" />
          </div>
          <div class="ef">
            <span class="lbl">Time est. (min)</span>
            <input type="number" class="fi" value="${t.timeEstimate||''}" min="5" step="5"
              onblur="upd(${t.id},'timeEstimate',this.value)" />
          </div>
          <div class="ef full">
            <span class="lbl">Tags (comma separated)</span>
            <input class="fi" value="${esc(t.tags.join(', '))}" placeholder="#tag1, #tag2"
              onblur="updTags(${t.id},this.value)" />
          </div>
        </div>

        <div class="sh">📝 Notes</div>
        <textarea class="notes-area" onblur="upd(${t.id},'notes',this.value)"
          placeholder="Add notes…">${esc(t.notes)}</textarea>

        <div class="sh">🔗 Links</div>
        <div class="links-area">
          ${linksHtml}
          <div class="add-link-row">
            <input id="lu-${t.id}" type="url" placeholder="https://…"
              style="flex:2;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#f8faff;color:var(--text-2);"
              onkeydown="if(event.key==='Enter')addLink(${t.id})" />
            <input id="ll-${t.id}" type="text" placeholder="Label (optional)"
              style="flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#f8faff;color:var(--text-2);"
              onkeydown="if(event.key==='Enter')addLink(${t.id})" />
            <button class="mb pr" onclick="addLink(${t.id})">Add</button>
          </div>
        </div>

        <div class="sh">📎 Attachments</div>
        <div class="attach-area">
          ${attHtml}
          <button class="fpick" onclick="openPicker(${t.id})">📎 Attach file</button>
          <span class="fhint">Max 10 MB · images & PDFs</span>
        </div>

        <div class="sh">🔁 Recurring</div>
        <div class="recur-opts">${recHtml}</div>

        <div class="arow">
          <button class="mb pr" onclick="collapse()">✓ Save &amp; close</button>
          <button class="mb dr" onclick="del(${t.id})">🗑 Delete</button>
          <button class="mb" onclick="toggleDone(${t.id},event)">
            ${t.completed ? '↩ Mark incomplete' : '✓ Mark complete'}
          </button>
        </div>
      </div>`;
  }

  return `
    <div class="card ${pc} ${dc}" onclick="toggleX(${t.id})">
      <div class="crow">
        <div class="nc">
          <span>${num}</span>
          <input type="checkbox" class="cbx" ${t.completed ? 'checked' : ''}
            onclick="toggleDone(${t.id},event)" />
        </div>
        <div>
          <div class="tname-row">
            <span class="dot ${t.priority==='high'?'hi':t.priority==='low'?'lo':'md'}"></span>
            <span class="tname">${esc(t.title)}</span>
          </div>
          <div class="chips">${catChip}${tagChips}${indicators ? `<span class="inds">${indicators}</span>` : ''}</div>
        </div>
        <div class="dc">📅 ${fmtD(t.dueDate)}</div>
        <div class="tc">🕐 ${fmtT(t.timeEstimate)}</div>
        <div class="sc">${badge}</div>
      </div>
      ${xhtml}
    </div>`;
}

// ─── CSV export ───────────────────────────────────────────────────────────

const CSV_COLS = ['id','title','category','tags','priority','dueDate','timeEstimate','notes','links','recurring','completed','createdAt'];

function csvCell(val) {
  if (val === null || val === undefined) return '';
  const s = Array.isArray(val)
    ? val.map(v => typeof v === 'object' ? JSON.stringify(v) : v).join('|')
    : String(val);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV() {
  const rows = [CSV_COLS.join(',')];
  for (const t of tasks) {
    rows.push(CSV_COLS.map(col => {
      if (col === 'tags')  return csvCell(t.tags);
      if (col === 'links') return csvCell(t.links.map(l => `${l.label}::${l.url}`));
      return csvCell(t[col]);
    }).join(','));
  }
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tasks-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─── CSV import ───────────────────────────────────────────────────────────

function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const lines = ev.target.result.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) { alert('CSV appears empty.'); return; }

      const header = parseCSVRow(lines[0]).map(h => h.trim().toLowerCase());
      if (!header.includes('title')) { alert('CSV must have a "title" column.'); return; }

      const rows = []; let skipped = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVRow(lines[i]);
        const get = (col, fb = '') => { const idx = header.indexOf(col); return idx >= 0 && cols[idx] !== undefined ? cols[idx].trim() : fb; };
        const title = get('title');
        if (!title) { skipped++; continue; }

        const tagsRaw = get('tags');
        const tags = tagsRaw ? tagsRaw.split('|').map(s => s.trim()).filter(Boolean) : [];
        const linksRaw = get('links');
        const links = linksRaw
          ? linksRaw.split('|').map(s => { const [label, url] = s.split('::'); return url ? { label: label.trim(), url: url.trim() } : { label: s.trim(), url: s.trim() }; }).filter(l => l.url)
          : [];

        rows.push({
          title,
          category:      ['work','personal','learning'].includes(get('category')) ? get('category') : 'work',
          tags,
          priority:      ['high','medium','low'].includes(get('priority')) ? get('priority') : 'medium',
          due_date:      get('duedate') || get('due_date') || get('dueDate') || null,
          time_estimate: parseInt(get('timeestimate') || get('time_estimate') || get('timeEstimate')) || null,
          notes:         get('notes'),
          links,
          attachments:   [],
          recurring:     get('recurring') || null,
          completed:     get('completed', 'false').toLowerCase() === 'true',
        });
      }

      if (!rows.length) { alert('No valid rows found.'); return; }

      setSyncing(true);
      const { data, error } = await db.from('tasks').insert(rows).select();
      setSyncing(false);

      if (error) { setSyncError(); alert('Import failed: ' + error.message); return; }

      tasks.push(...(data || []).map(fromDB));
      render();
      const added = data ? data.length : 0;
      alert(`Imported ${added} task${added !== 1 ? 's' : ''}${skipped ? ` (${skipped} row${skipped !== 1 ? 's' : ''} skipped)` : ''}.`);
    } catch (err) {
      alert('Failed to parse CSV: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function parseCSVRow(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { result.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  result.push(cur);
  return result;
}

// ─── Speech recognition ───────────────────────────────────────────────────

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, isRecording = false;

function toggleMic() {
  if (!SR) { alert('Speech recognition is not supported in this browser.\nTry Chrome or Edge.'); return; }
  isRecording ? stopMic() : startMic();
}

function startMic() {
  recog = new SR();
  recog.lang = 'en-US';
  recog.continuous = false;
  recog.interimResults = true;

  const btn = document.getElementById('micBtn');
  const inp = document.getElementById('addInp');
  const saved = inp.value;

  recog.onstart = () => { isRecording = true; btn.classList.add('recording'); inp.placeholder = 'Listening…'; };
  recog.onresult = e => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    inp.value = saved ? saved + ' ' + transcript : transcript;
  };
  recog.onerror = e => {
    stopMic();
    if (e.error === 'not-allowed') inp.placeholder = 'Microphone access denied';
    else if (e.error !== 'no-speech') inp.placeholder = 'Recognition error: ' + e.error;
    setTimeout(() => { inp.placeholder = 'Type a task — or tap 🎤 to speak'; }, 3000);
  };
  recog.onend = () => stopMic();
  recog.start();
}

function stopMic() {
  isRecording = false;
  const btn = document.getElementById('micBtn');
  if (btn) { btn.classList.remove('recording'); }
  const inp = document.getElementById('addInp');
  if (inp && inp.placeholder === 'Listening…') inp.placeholder = 'Type a task — or tap 🎤 to speak';
  if (recog) { try { recog.stop(); } catch {} recog = null; }
}

// ─── Boot ─────────────────────────────────────────────────────────────────
loadTasks();
